[project]
name = "managed-id-with-keyvault"
version = "0.1.0"
description = "Bootstrap .env files from Azure Key Vault"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.16.0",
    "azure-keyvault-secrets>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
files = ["main.py", "sample.example", "utility", "tests"]
